[project]
name = "market-microstructure-execution"
version = "0.1.0"
description = "Point-in-time limit order book research and execution framework"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "statsmodels>=0.14,<0.15", "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4", "pyarrow>=18,<24", "numba>=0.61,<0.66",
  "PyYAML>=6,<7", "joblib>=1.4,<2",
  "akshare>=1.19.1,<2", "easyquotation>=0.7.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_microstructure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".venv", "outputs", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
