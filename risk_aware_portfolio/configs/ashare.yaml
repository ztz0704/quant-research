# Fixed before downloading data; this is an integration validation, not alpha discovery.
data:
  input_path: data/processed/ashare_panel.parquet
  alpha_path: null
  max_abs_return: 0.95
real_data:
  provider: akshare_sina_raw
  share_fallback: sina_dated_float_a_history
  universe_path: configs/ashare_universe.csv
  suspension_path: configs/ashare_suspensions.csv
  suspension_policy: mark_last_and_defer_all_trades
  raw_dir: data/raw/ashare
  output_dir: outputs/ashare
  fetch_start: "2022-01-01"
  end_date: "2023-12-29"
  calendar_symbol: sh000001
  request_timeout: 20
  retries: 3
  request_pause: 0.3
  momentum_lookback: 126
  momentum_skip: 21
  volatility_window: 63
  liquidity_window: 21
  reversal_window: 5
  execution_delay_sessions: 1
  universe_description: "Retrospectively specified fixed 60-stock basket; not historical index membership"
  classification_description: "Researcher supplied coarse business groups; not vendor-certified PIT industries"
risk_model:
  industries: [banks, other_financials, consumer, industrials, resources_utilities, technology_healthcare]
  styles: [size, momentum, volatility, liquidity]
  regression: wls
  weight_power: 0.5
  lookback: 126
  min_observations: 63
  covariance_method: ewma
  specific_method: ewma
  ewma_lambda: 0.94
  variance_floor: 0.000001
  eigenvalue_floor: 0.0000000001
  specific_shrinkage: 0.15
alpha:
  winsorize: true
  mad_multiplier: 5.0
  neutralize: false
  neutralization: joint
  scale: 0.0006
portfolio:
  long_only: true
  risk_aversion: 5.0
  cost_penalty: 1.0
  max_weight: 0.03
  gross_limit: 1.0
  turnover_limit: 0.30
  industry_tolerance: 0.10
  style_tolerance: 0.30
  tracking_error_annual: 0.12
  solver: CLARABEL
  solver_options:
    tol_gap_abs: 0.0000001
    tol_gap_rel: 0.0000001
    tol_feas: 0.00000001
    max_iter: 300
  constraint_tolerance: 0.000002
  baseline_quantile: 0.20
transaction_cost:
  # Sell-side stamp duty; dated schedule is also used in the convex objective.
  sell_bps_schedule: [["2022-01-01", 10.0], ["2023-08-28", 5.0]]
  linear_bps: 5.0
  impact_coefficient: 0.002
  optimization_impact: true
  trade_scale: 0.01
backtest:
  evaluation_start: "2023-01-03"
  rebalance_frequency: weekly
  annualization: 252
  realized_risk_window: 21
experiments:
  risk_aversion: [1.0, 5.0, 20.0]
  cost_penalty: [0.0, 1.0, 5.0]
  position_limits: [0.02, 0.05, 0.10]
  covariance_methods: [sample, ewma]
  alpha_modes: [raw, neutralized]
  rebalance_frequencies: [daily, weekly, monthly]
  stress_seed: 807
  alpha_noise_std: 0.50
  covariance_perturbation: 0.25
  cost_multiplier: 3.0
  liquidity_multiplier: 4.0
  volatility_multiplier: 2.0
  local_alpha_noise_fraction: 0.01
reporting:
  rolling_sharpe_window: 63
  rolling_volatility_window: 21
  hac_lags: 5
  bootstrap_block: 10
  bootstrap_repetitions: 500
  bootstrap_seed: 987
