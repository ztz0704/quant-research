[project]
name = "risk-aware-portfolio"
version = "0.1.0"
description = "Point-in-time factor risk, constrained portfolios, and auditable attribution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "matplotlib>=3.9,<4", "cvxpy>=1.6,<2", "pyarrow>=18,<25",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
real-data = ["akshare>=1.19.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", ".venv", "outputs", "notebooks", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
cache-dir = ".cache/uv"
