project:
  name: robust-alpha-discovery-akshare-smoke
  random_seed: 20260826

data:
  source: parquet
  provider: akshare
  path: data/raw/akshare_smoke.parquet
  start_date: "2018-01-02"
  end_date: "2020-12-31"
  adjust: qfq
  endpoint: tencent
  timeout_seconds: 20
  retries: 3
  pause_seconds: 0.15
  min_history: 125
  # Fixed, liquid, long-listed A-share sample for integration testing only.
  # This is not a point-in-time index universe and must not support an alpha claim.
  symbols:
    - "000001"
    - "000002"
    - "000063"
    - "000069"
    - "000100"
    - "000157"
    - "000333"
    - "000338"
    - "000425"
    - "000538"
    - "000568"
    - "000625"
    - "000651"
    - "000725"
    - "000768"
    - "000776"
    - "000858"
    - "000895"
    - "000963"
    - "002027"
    - "600000"
    - "600009"
    - "600015"
    - "600016"
    - "600018"
    - "600019"
    - "600028"
    - "600029"
    - "600030"
    - "600031"
    - "600036"
    - "600048"
    - "600050"
    - "600104"
    - "600111"
    - "600150"
    - "600276"
    - "600309"
    - "600519"
    - "600900"

timing:
  target_column: target_o2o
  require_entry_tradable: true
  require_exit_tradable: true

preprocessing:
  method: rank_gaussian

signals:
  - mom_5
  - mom_20
  - rev_1
  - neg_vol_20
  - neg_amihud_20

evaluation:
  annualization: 252
  min_assets_per_date: 20
  hac_maxlags: 5
  quantile: 0.20

walk_forward:
  train_years: 2
  top_k: 3

costs:
  bps: [0, 10, 20, 30]

multiple_testing:
  alpha: 0.05
  block_length: 20
  bootstrap_replications: 100

output:
  panel_path: data/processed/akshare_smoke_research_panel.parquet
  directory: reports/generated/akshare_smoke
