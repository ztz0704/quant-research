# Copy this file to configs/local_experiment_v1.yaml before editing it.
# Local configs are ignored by Git so licensed paths and private choices stay local.
project:
  name: robust-alpha-discovery-v1
  random_seed: 20260826

protocol:
  version: draft-v0.1
  status: draft

data:
  source: parquet
  path: data/raw/a_share_daily.parquet
  min_history: 125

time_split:
  development: ["2013-01-01", "2020-12-31"]
  validation: ["2021-01-01", "2023-12-31"]
  final_holdout: ["2024-01-01", "2025-12-31"]
  final_holdout_confirmed_untouched: false

timing:
  target_column: target_o2o
  require_entry_tradable: true
  require_exit_tradable: true

preprocessing:
  method: rank_gaussian

signals:
  - mom_5
  - mom_20
  - mom_60
  - mom_120
  - mom_20_skip5
  - rev_1
  - rev_3
  - rev_5
  - neg_vol_10
  - neg_vol_20
  - neg_vol_60
  - neg_range_10
  - neg_range_20
  - neg_amihud_20
  - neg_amihud_60
  - volshock_5_20
  - ma_gap_20
  - ma_gap_60
  - mom20_over_vol20
  - mom60_over_vol60

evaluation:
  annualization: 252
  min_assets_per_date: 30
  hac_maxlags: 5
  quantile: 0.10

walk_forward:
  train_years: 5
  top_k: 5

costs:
  bps: [0, 10, 20, 30]

multiple_testing:
  alpha: 0.05
  block_length: 20
  bootstrap_replications: 2000

output:
  panel_path: data/processed/v1_research_panel.parquet
  directory: reports/generated/v1
