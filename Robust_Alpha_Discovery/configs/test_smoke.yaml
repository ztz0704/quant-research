project:
  name: smoke
  random_seed: 123
data:
  source: synthetic
  path: tmp/pipeline_smoke/synthetic.parquet
  start_date: "2018-01-02"
  n_days: 320
  n_assets: 20
  min_history: 65
timing:
  target_column: target_o2o
  require_entry_tradable: true
  require_exit_tradable: true
preprocessing:
  method: rank_gaussian
signals: [mom_20, mom_60, rev_5, neg_vol_20, neg_amihud_20]
evaluation:
  annualization: 252
  min_assets_per_date: 10
  hac_maxlags: 3
  quantile: 0.20
walk_forward:
  train_years: 1
  top_k: 2
costs:
  bps: [0, 10]
multiple_testing:
  alpha: 0.05
  block_length: 10
  bootstrap_replications: 20
output:
  panel_path: tmp/pipeline_smoke/panel.parquet
  directory: tmp/pipeline_smoke/report
