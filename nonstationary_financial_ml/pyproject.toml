[project]
name = "nonstationary-financial-ml"
version = "0.1.0"
description = "Auditable temporal A-share return prediction and nonstationarity research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "statsmodels>=0.14,<1", "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4", "pyarrow>=18,<25", "pyyaml>=6,<7", "joblib>=1.4,<2",
  "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
real-data = ["akshare>=1.19.1,<2"]
boosting = ["lightgbm>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../Robust_Alpha_Discovery/src", "../risk_aware_portfolio/src"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "outputs", "notebooks", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
cache-dir = "../tmp/uv-cache"
